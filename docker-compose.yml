# Local PostgreSQL for Sutra ERP. Credentials come from .env (see .env.example).
services:
  db:
    image: postgres:17-alpine
    container_name: sutra-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sutra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sutra_erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sutra_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sutra_pgdata:
